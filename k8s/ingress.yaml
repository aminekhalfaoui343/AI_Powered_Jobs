apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: job-intelligence
  labels:
    app.kubernetes.io/name: job-intelligence
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
spec:
  ingressClassName: nginx
  rules:
    - host: job-intelligence.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
