apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: job-intelligence
    includeSelectors: true

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml

images:
  - name: job-intelligence
    newName: job-intelligence
    newTag: local
